# Local plugin source for Noctalia.
# Served over HTTP by darkhttpd on port 20442; also usable as a path source.
# Keep one [[plugin]] row per plugin subdirectory.

[[plugin]]
id = "io.soloev/better-launchpad"
name = "Better Launchpad"
version = "0.6.10"
author = "io.soloev"
license = "MIT"
icon = "rocket"
description = "Built-in launcher's Simple layout as a standalone panel: apps, calculator, emoji, wallpapers, session, windows."
plugin_api = 46
tags = ["launcher", "panel", "utility"]
dependencies = []

[[plugin]]
id = "io.soloev/better-taskbar"
